<script>
/*
 * PMG pricing engine, version 1.0.0
 *
 * Exact decimal arithmetic (BigInt, no floating point). Works in Node and in the browser.
 * Inputs may be strings or numbers; strings are safest ("33.7569"). Results are strings.
 *
 * Rounding rule: every price is rounded ONCE, at the end, half up (a tie such as 1.005 goes to 1.01).
 * The only intermediate rounding is where the shop's own rule says a rounded price feeds the next one
 * (see "feeds" notes below), because the customer sees and relies on the rounded number.
 */
(function (root, factory) {
  if (typeof module === "object" && module.exports) module.exports = factory();
  else root.PMGPricing = factory();
})(typeof self !== "undefined" ? self : this, function () {
  "use strict";

  var VERSION = "1.1.1";

  // Named constants. Change one only by releasing a new VERSION.
  var CONSTANTS = {
    TROY_OZ_G: "31.1034768",      // grams per troy ounce, exact definition. Reference only, not used in prices
    OZ_G_BAHT: "31.1035",         // grams per troy ounce used for baht-weight prices. Shop convention (matches your 11 quotes)
    BAHT_G: "15.244",             // grams per Thai gold baht-weight
    BAHT_PURITY: "0.965",         // Thai gold 96.5%
    OZ_PER_KG_GOLD: "32.148",     // troy oz per kg used for gold. Shop convention, confirmed 30 Oct 2026
    OZ_PER_KG_SILVER: "32.1507",  // troy oz per kg used for silver. Confirmed 30 Oct 2026
    LB_PER_TON: "2204.62262",     // pounds per metric ton (COMEX copper feed conversion)
    SILVER_925: "0.925"           // sterling purity
  };

  // ---------- exact decimal ----------
  function Dec(n, s) { this.n = n; this.s = s; } // value = n / 10^s
  var P10 = {};
  function pow10(k) { return P10[k] || (P10[k] = 10n ** BigInt(k)); }

  function numStr(x) {
    if (!isFinite(x)) throw new Error("not a finite number: " + x);
    var t = String(x);
    if (/e/i.test(t)) t = x.toFixed(20).replace(/0+$/, "").replace(/\.$/, "");
    return t;
  }
  function D(x) {
    if (x instanceof Dec) return x;
    var t = typeof x === "number" ? numStr(x) : String(x).trim();
    var m = /^(-?)(\d+)(?:\.(\d+))?$/.exec(t);
    if (!m) throw new Error("not a decimal: " + x);
    var f = m[3] || "";
    var n = BigInt(m[2] + f);
    return new Dec(m[1] ? -n : n, f.length);
  }
  function align(a, b) {
    var s = Math.max(a.s, b.s);
    return [a.n * pow10(s - a.s), b.n * pow10(s - b.s), s];
  }
  function add(a, b) { var q = align(D(a), D(b)); return new Dec(q[0] + q[1], q[2]); }
  function sub(a, b) { var q = align(D(a), D(b)); return new Dec(q[0] - q[1], q[2]); }
  function mul(a, b) { a = D(a); b = D(b); return new Dec(a.n * b.n, a.s + b.s); }
  // integer division with half-up rounding (ties away from zero)
  function divRound(num, den) {
    if (den === 0n) throw new Error("division by zero");
    var neg = (num < 0n) !== (den < 0n);
    var an = num < 0n ? -num : num, ad = den < 0n ? -den : den;
    var q = an / ad, r = an % ad;
    if (2n * r >= ad) q += 1n;
    return neg ? -q : q;
  }
  // a / b rounded to `dp` decimal places
  function divTo(a, b, dp) {
    a = D(a); b = D(b);
    var num = a.n * pow10(dp + b.s), den = b.n * pow10(a.s);
    return new Dec(divRound(num, den), dp);
  }
  function roundTo(a, dp) {
    a = D(a);
    if (a.s <= dp) return new Dec(a.n * pow10(dp - a.s), dp);
    return new Dec(divRound(a.n, pow10(a.s - dp)), dp);
  }
  function str(a, dp) {
    a = roundTo(a, dp);
    var neg = a.n < 0n, v = (neg ? -a.n : a.n).toString();
    if (dp === 0) return (neg ? "-" : "") + v;
    while (v.length <= dp) v = "0" + v;
    return (neg ? "-" : "") + v.slice(0, v.length - dp) + "." + v.slice(v.length - dp);
  }
  function positive(name, x) {
    var d = D(x);
    if (d.n <= 0n) throw new Error(name + " must be greater than zero");
    return d;
  }
  function nonNeg(name, x) {
    var d = D(x);
    if (d.n < 0n) throw new Error(name + " must not be negative");
    return d;
  }

  function audit(rule, inputs, used) {
    var c = {};
    used.forEach(function (k) { c[k] = CONSTANTS[k]; });
    return { version: VERSION, rule: rule, constants: c, inputs: inputs };
  }

  // ---------- products ----------

  // Gold 99.99%, THB per kg.  offer = round2(gold * 32.148 * fx + add);  bid = round2(offer - deduct)
  // feeds: the bid is taken from the rounded offer.
  function gold99(i) {
    var gold = positive("gold", i.gold), fx = positive("fx", i.fx);
    var add_ = nonNeg("add", i.add == null ? 0 : i.add), ded = nonNeg("deduct", i.deduct == null ? 0 : i.deduct);
    var offer = roundTo(add(mul(mul(gold, CONSTANTS.OZ_PER_KG_GOLD), fx), add_), 2);
    var bid = roundTo(sub(offer, ded), 2);
    return { bid: str(bid, 2), offer: str(offer, 2), unit: "THB/kg",
      audit: audit("gold99.v1", i, ["OZ_PER_KG_GOLD"]) };
  }

  // Gold 96.5% bar and ornament, THB per baht-weight.
  // Starts from the Gold Traders Association announcement and moves it by the change in (spot * fx) since
  // the announcement (the "anchor"). ratio = (gold*fx) / (anchorGold*anchorFx).
  //   bar.bid   = round2(gtaBarBid * ratio)          bar.offer = round2(gtaBarOffer * ratio)
  //   orn.offer = round2(gtaOrnOffer * ratio)        orn.taxBase = round2(gtaTax * ratio)
  //   orn.bid   = round2(bar.bid * (100 - ornDeductPct) / 100)   feeds: uses the rounded bar bid
  function goldBaht96(i) {
    var gold = positive("gold", i.gold), fx = positive("fx", i.fx);
    var aG = positive("anchorGold", i.anchorGold), aF = positive("anchorFx", i.anchorFx);
    var num = mul(gold, fx), den = mul(aG, aF);
    // divide once from the exact product; that single division is the only rounding
    function movedExact(x) {
      var top = mul(positive("gta price", x), num);
      return divTo(top, den, 2);
    }
    var barBid = movedExact(i.gtaBarBid), barOffer = movedExact(i.gtaBarOffer);
    var ornOffer = movedExact(i.gtaOrnOffer), tax = movedExact(i.gtaTax);
    var ded = nonNeg("ornDeductPct", i.ornDeductPct == null ? 0 : i.ornDeductPct);
    var ornBid = divTo(mul(barBid, sub(100, ded)), 100, 2);
    return {
      bar: { bid: str(barBid, 2), offer: str(barOffer, 2) },
      ornament: { bid: str(ornBid, 2), offer: str(ornOffer, 2), taxBase: str(tax, 2) },
      unit: "THB/baht-weight",
      audit: audit("goldBaht96.v1", i, [])
    };
  }

  // Silver, THB per kg.  base = silver * 32.1507 * fx (not rounded)
  //   s99.bid = round2(base - bidDeduct)   s99.offer = round2(base + offerAdd)
  //   s925 = round2(s99 * 0.925)           feeds: 92.5% is taken from the rounded 99.99% price
  function silver(i) {
    var s = positive("silver", i.silver), fx = positive("fx", i.fx);
    var base = mul(mul(s, CONSTANTS.OZ_PER_KG_SILVER), fx);
    var bid = roundTo(sub(base, nonNeg("bidDeduct", i.bidDeduct == null ? 0 : i.bidDeduct)), 2);
    var offer = roundTo(add(base, nonNeg("offerAdd", i.offerAdd == null ? 0 : i.offerAdd)), 2);
    return {
      s99: { bid: str(bid, 2), offer: str(offer, 2) },
      s925: { bid: str(mul(bid, CONSTANTS.SILVER_925), 2), offer: str(mul(offer, CONSTANTS.SILVER_925), 2) },
      unit: "THB/kg",
      audit: audit("silver.v1", i, ["OZ_PER_KG_SILVER", "SILVER_925"])
    };
  }

  // Copper flat price, THB per kg, whole baht.  flat = round0(lme * fx / 1000)
  // Grade price = round0(flat + adjustment); adjustment is usually negative and may be a decimal.
  function copper(i) {
    var lme = positive("lme", i.lme), fx = positive("fx", i.fx);
    var flat = divTo(mul(lme, fx), 1000, 0);
    var grades = (i.adjustments || []).map(function (a) { return str(add(flat, a), 0); });
    return { flat: str(flat, 0), grades: grades, unit: "THB/kg", audit: audit("copper.v1", i, []) };
  }

  // Order total for a weight. rate is a price from above.
  //   unit "kg":   total = rate * grams / 1000
  //   unit "baht": total = rate * grams / 15.244      (rate is per baht-weight)
  // One division at the end, then rounded to dp (2 for gold and silver, 0 for copper).
  function orderTotal(i) {
    var rate = positive("rate", i.rate), g = positive("grams", i.grams);
    var dp = i.dp == null ? 2 : i.dp;
    var top = mul(rate, g), total;
    if (i.unit === "kg") total = divTo(top, 1000, dp);
    else if (i.unit === "baht") total = divTo(top, CONSTANTS.BAHT_G, dp);
    else throw new Error("unit must be kg or baht");
    return { total: str(total, dp), audit: audit("orderTotal.v1", i, i.unit === "baht" ? ["BAHT_G"] : []) };
  }

  // THEORETICAL valuation of Thai 96.5% gold, THB per baht-weight. NOT a dealer quote.
  //   bid = (spot - bidSpread) * 15.244 / 31.1035 * fx * 0.965     offer = (spot + askSpread) * ...
  // This is the formula printed on the website's price table. It is a reference for comparison only.
  function theoreticalBaht96(i) {
    var spot = positive("spot", i.spot), fx = positive("fx", i.fx);
    var bs = nonNeg("bidSpread", i.bidSpread == null ? "3.5" : i.bidSpread);
    var as = nonNeg("askSpread", i.askSpread == null ? "1.5" : i.askSpread);
    function at(px) {
      var top = mul(mul(mul(px, CONSTANTS.BAHT_G), fx), CONSTANTS.BAHT_PURITY);
      return divTo(top, CONSTANTS.OZ_G_BAHT, 2);
    }
    return { bid: str(at(sub(spot, bs)), 2), offer: str(at(add(spot, as)), 2), unit: "THB/baht-weight",
      priceType: "theoretical",
      audit: audit("theoreticalBaht96.v1", i, ["BAHT_G", "BAHT_PURITY", "OZ_G_BAHT"]) };
  }

  // Value of a weight of metal at its purity, in THB. No dealer margin, add-on or spread.
  //   gold, unit baht : spot * fx * (baht * 15.244 g) / 31.1035 * purity
  //   gold, unit g/kg : spot * fx * 32.148 oz/kg * kg * purity
  //   silver, g/kg    : spot * fx * 32.1507 oz/kg * kg * purity
  //   copper, kg/t    : lme * fx / 1000 * kg   (no purity), spot is USD per metric ton
  // Rounded once to 2 decimals, half up.
  function valuation(i) {
    var spot = positive("spot", i.spot), fx = positive("fx", i.fx), w = positive("weight", i.weight);
    var metal = i.metal, unit = i.unit, purity = metal === "copper" ? D(1) : positive("purity", i.purity);
    if (purity.n > pow10(purity.s)) throw new Error("purity must not exceed 1");
    var base = mul(spot, fx), used = [], rule;
    if (metal === "gold" && unit === "baht") {
      var grams = mul(w, CONSTANTS.BAHT_G);
      var top = mul(mul(base, grams), purity);
      used = ["BAHT_G", "OZ_G_BAHT"]; rule = "valuation.goldBaht.v1";
      return { value: str(divTo(top, CONSTANTS.OZ_G_BAHT, 2), 2), unit: "THB", priceType: "theoretical",
        audit: audit(rule, i, used) };
    }
    if (metal === "gold" || metal === "silver") {
      var perOz = metal === "gold" ? CONSTANTS.OZ_PER_KG_GOLD : CONSTANTS.OZ_PER_KG_SILVER;
      if (unit !== "kg" && unit !== "g") throw new Error("unit must be g or kg (or baht for gold)");
      // grams are converted to kg by shifting the decimal point, so nothing is rounded
      var kgExact = unit === "kg" ? w : new Dec(w.n, w.s + 3);
      return { value: str(mul(mul(mul(base, perOz), kgExact), purity), 2), unit: "THB", priceType: "theoretical",

    }

      return { value: str(divTo(mul(base, kgc), 1000, 2), 2), unit: "THB", priceType: "theoretical",
        audit: audit("valuation.copper.v1", i, []) };
    }
    throw new Error("metal must be gold, silver or copper");
  }

  // COMEX HG (USD per lb) to USD per metric ton.
  function comexToTon(hg) {
    return str(mul(positive("hg", hg), CONSTANTS.LB_PER_TON), 2);
  }

  return {
    VERSION: VERSION, CONSTANTS: CONSTANTS,
    gold99: gold99, goldBaht96: goldBaht96, silver: silver, copper: copper,
    orderTotal: orderTotal, theoreticalBaht96: theoreticalBaht96, valuation: valuation, comexToTon: comexToTon
  };
});

      h+='<tr><td><span class="bd '+m+'">'+m+'</span></td><td><span class="bd '+sd+'">'+sd+'</span></td><td class="r">'+f(r.g/1000,2)+'</td><td>'+pur(r.n)+'</td><td class="r">฿'+f(r.rate,r.dec)+'<div class="pg">'+r.unit+'</div></td><td class="r"><b>฿'+f(r.tot,r.dec)+'</b></td><td><span class="bd '+r.st+'">'+stL(r.st)+'</span></td><td class="r dn">฿'+f(r.tot,r.dec)+'</td><td class="'+(r.due<now?"dn":"")+'">'+dstr(r.due)+'</td><td>'+
      (r.st==="Booked"&&m!=="Copper"?'<button class="ab" data-a="rf" data-id="'+r.id+'">Refine</button>':'')+'<button class="ab" data-a="ok" data-id="'+r.id+'" title="Settle">✓ Settle</button><button class="ab" data-a="x" data-id="'+r.id+'" title="Cancel">Cancel</button></td></tr>'});
    h+='</tbody></table></div>'}
  $("p_port").innerHTML=h;
}
$("p_port").addEventListener("click",function(e){
  var b=e.target.closest("[data-a]");if(!b)return;var a=b.getAttribute("data-a");
  if(a==="new"){page="trade";render();window.scrollTo(0,0);return}
  if(a==="rr"){port();return}
  var id=b.getAttribute("data-id"),tx=loadTx().map(norm);
  tx.forEach(function(r){if(r.id!==id)return;if(a==="rf"){r.st="Refine";r.due=Date.now()+C.rDays*864e5}else if(a==="ok")r.st="Settled";else if(a==="x")r.st="Cancelled"});
  saveTx(tx);hist();port();
});
function fld(l,id,v,sm){return '<div class="fld"><div>'+l+(sm?'<small>'+sm+'</small>':'')+'</div><input id="'+id+'" type="number" step="any" inputmode="decimal" value="'+v+'"></div>'}
function setp(){
  if(!isOwner){$("p_set").innerHTML='<h2>Setting</h2><div class="card pg">Settings are managed by the Baht Desk admin.</div>';return}
  var h='<h2>Admin settings</h2><div class="card">'+srcSel()+'<p class="pg">Live prices refresh every minute and replace the typed values below. Changes apply when you press Save and publish.</p></div><h2>Spot prices</h2><div class="card">'+fld("USD/THB rate","a_fx",C.fx)+fld("Gold spot (USD/oz)","a_g",C.gold)+fld("Silver spot (USD/oz)","a_s",C.silver)+fld("Copper LME CSP (USD/ton)","a_l",C.lme,'Official cash settlement price from <a href="https://www.lme.com/Metals/Non-ferrous/LME-Copper#Trading+summary" target="_blank" rel="noopener">lme.com</a>. Last entered: '+luTxt()+(luOk()?'':' (expired)'))+'<label class="pg" id="a_lcw" style="display:block;margin-top:8px"><input type="checkbox" id="a_lc"> This LME price is today\'s price (tick when the price is unchanged since the last entry)</label></div>'+
  '<h2>Gold 96.5% from Gold Traders Association</h2><div class="card">'+fld("Bar bid (รับซื้อ)","a_bb",C.gta.bb,"THB per gold baht")+fld("Bar offer (ขายออก)","a_bo",C.gta.bo,"THB per gold baht")+fld("Ornament offer (ขายออก)","a_oo",C.gta.oo,"THB per gold baht")+fld("Ornament tax base (ฐานภาษี)","a_tx",C.gta.tax,"THB per gold baht")+'<div class="fld"><div>Announcement<small>Date, time and round</small></div><input id="a_at" type="text" value="'+C.gta.at+'"></div><p class="pg">When you change these numbers, they are matched to the spot and USD/THB entered above. After that, prices move with spot × USD/THB.</p></div>'+
  '<h2>Gold 99.99% and silver adjustments</h2><div class="card">'+fld("Gold 99.99% add-on","a_ga",C.gAdd,"THB per kg, added to the offer")+fld("Gold 99.99% bid deduction","a_gd",C.gDed,"THB per kg, taken off the offer")+fld("Ornament bid deduction","a_od",C.oDed,"% off the bar bid")+fld("Silver bid deduction","a_sb",C.sB,"THB per kg")+fld("Silver offer add-on","a_sa",C.sAdd,"THB per kg")+'</div>'+
  '<h2>Settlement terms</h2><div class="card">'+fld("Trade settlement","a_td",C.tDays,"days after booking")+fld("Refine settlement","a_rd",C.rDays,"days after sending for refining")+'</div>'+
  '<h2>Copper adjustment vs copper price (THB/kg)</h2><div class="card">';
  GR.forEach(function(n,i){h+=fld(n,"a_p"+i,C.prem[i])});
  h+='<div class="fld"><div>Demo price movement<small>Simulates a 1-minute feed</small></div><select id="a_d"><option value="0">Off</option><option value="1"'+(C.demo?" selected":"")+'>On</option></select></div></div><button class="pri" id="save">Save and publish</button> <span id="msg" class="pg"></span>';
  $("p_set").innerHTML=h;$("save").onclick=save;wireSrc();
}
function num(id,d){var v=parseFloat($(id).value);return isFinite(v)?v:d}
function stamp(){return new Date().toLocaleString("en-GB",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"})}
function buildHtml(){
  var c=document.documentElement.cloneNode(true);
  c.querySelector("#cfg").textContent=JSON.stringify(C).replace(/</g,"\\u003c");
  [].forEach.call(c.querySelectorAll("[data-d]"),function(s){s.innerHTML="";s.hidden=s.id!=="p_home"});
  return "<!DOCTYPE html>\n"+c.outerHTML;
}
async function save(){
  prev={gold:C.gold,silver:C.silver,lme:C.lme};
  C.live=$("a_live").value==="1";C.liveFx=$("a_livefx").value==="1";C.liveCu=$("a_livecu").value==="1";
  if(!C.live){C.gold=num("a_g",C.gold);C.silver=num("a_s",C.silver)}
  if(!C.liveFx)C.fx=num("a_fx",C.fx);
  if(!C.liveCu){var nl=num("a_l",C.lme);if(nl!==C.lme||$("a_lc").checked){C.lme=nl;C.luT=Date.now();C.luBy=who}}
  var g=C.gta,n={bb:num("a_bb",g.bb),bo:num("a_bo",g.bo),oo:num("a_oo",g.oo),tax:num("a_tx",g.tax),at:$("a_at").value||g.at};
  var ch=n.bb!==g.bb||n.bo!==g.bo||n.oo!==g.oo||n.tax!==g.tax;
  C.gta=n;if(ch)C.anc={s:C.gold,fx:C.fx};
  C.gAdd=num("a_ga",C.gAdd);C.gDed=num("a_gd",C.gDed);C.oDed=num("a_od",C.oDed);C.sB=num("a_sb",C.sB);C.sAdd=num("a_sa",C.sAdd);
  C.tDays=num("a_td",C.tDays);C.rDays=num("a_rd",C.rDays);C.prem=GR.map(function(n,i){return num("a_p"+i,C.prem[i])});C.demo=$("a_d").value==="1";C.at=stamp();
  var p=P();C.hist.unshift({t:C.at,g:C.gold,s:C.silver,fx:C.fx,l:C.lme,gb:p.g99.b,go:p.g99.o,sb:p.s99.b,so:p.s99.o});C.hist=C.hist.slice(0,60);
  $("msg").textContent="Publishing…";pull();
  try{var a=await claude.use("artifact");if(!a){$("msg").textContent="Publishing is not available here.";return}
    await a.publish(buildHtml())}catch(e){$("msg").textContent="Could not publish: "+(e&&(e.message||e.code)||"error")}
}
function anyLive(){return C.live||C.liveFx||C.liveCu}
function demoOn(){return C.demo&&!anyLive()}
function sel(id,on,l,sm,a,b){return '<div class="fld"><div>'+l+'<small>'+sm+'</small></div><select id="'+id+'"><option value="1"'+(on?" selected":"")+'>'+a+'</option><option value="0"'+(on?"":" selected")+'>'+b+'</option></select></div>'}
function srcSel(){return sel("a_live",C.live,"Gold and silver","From the live market feed","Live feed","Typed by admin")+sel("a_livefx",C.liveFx,"USD/THB","Live feed is a daily reference rate","Live feed","Typed by admin")+sel("a_livecu",C.liveCu,"Copper","Live feed is COMEX futures, not LME","Live feed","Typed by admin (LME)")}
function sync(){[["a_fx",C.fx],["a_g",C.gold],["a_s",C.silver],["a_l",C.lme]].forEach(function(p){var e=$(p[0]);if(e&&e.disabled)e.value=p[1]})}
function wireSrc(){[["a_live",["a_g","a_s"]],["a_livefx",["a_fx"]],["a_livecu",["a_l"]]].forEach(function(p){var s=$(p[0]),go=function(){p[1].forEach(function(i){$(i).disabled=s.value==="1"});sync()};s.onchange=go;go()})}
// ---- Live price feed: Gold-API (gold, silver, copper) + Frankfurter (USD/THB) ----
var API={px:"https://api.gold-api.com/price/",fx:"https://api.frankfurter.dev/v2/rates?base=USD&quotes=THB"},LIVE={ok:false,t:0,n:0,q:"",fxT:0,mT:0,cT:0,mOk:false,cOk:false,xOk:false},busy=false,TMO=8000;
function jget(u){var a=new AbortController(),t=setTimeout(function(){a.abort()},TMO);return fetch(u,{cache:"no-store",signal:a.signal}).then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}).finally(function(){clearTimeout(t)})}
// Orders are only allowed while every live price they depend on is fresh (last poll succeeded, under 2 minutes old; USD/THB under 30 minutes).
function fresh(t,ms){return Date.now()-t<(ms||120000)}
// Typed LME copper: an admin enters it each morning. It counts as current for 24 hours from the entry time.
var LU_MS=864e5;
function luOk(){return !!C.luT&&Date.now()-C.luT<LU_MS}
function esc(t){return String(t==null?"":t).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function luTxt(){return C.luT?new Date(C.luT).toLocaleString("en-GB",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"})+(C.luBy?" by "+esc(C.luBy):""):"not entered yet"}
function feedOk(pk){
  var cu=!!pk&&pk.charAt(0)==="c",x=!C.liveFx||(LIVE.xOk&&fresh(LIVE.fxT,18e5)),m=!C.live||(LIVE.mOk&&fresh(LIVE.mT)),c=!C.liveCu||(LIVE.cOk&&fresh(LIVE.cT));
  return pk?x&&(cu?(C.liveCu?c:luOk()):m):x&&m&&c;
}
function gateMsg(pk){
  var cu=!!pk&&pk.charAt(0)==="c";
  if(cu&&!C.liveCu&&!luOk()&&(!C.liveFx||(LIVE.xOk&&fresh(LIVE.fxT,18e5))))return"The LME copper price has not been entered in the last 24 hours, so copper orders are paused until the admin enters today's price.";
  return"Live prices are offline, so orders are paused. They resume when the feed reconnects."}
function quote(m){return jget(API.px+m).then(function(d){var v=d&&d.price;if(typeof v!=="number"||!(v>0))throw new Error(m+" bad price");return{v:v,t:d.updatedAt}})}
function rate(){return jget(API.fx).then(function(d){var v=Array.isArray(d)?d[0]&&d[0].rate:d&&d.rates&&d.rates.THB;if(typeof v!=="number"||!(v>0))throw new Error("bad rate");return v})}
async function pull(){
  if(busy||!anyLive())return;busy=true;
  try{
    var fxDue=C.liveFx&&Date.now()-LIVE.fxT>6e5;
    var R=await Promise.allSettled([C.live?quote("XAU"):null,C.live?quote("XAG"):null,C.liveCu?quote("HG"):null,fxDue?rate():null]);
    var ok=function(i){return R[i].status==="fulfilled"&&R[i].value!==null},first=!LIVE.n,o={g:C.gold,s:C.silver,l:C.lme,f:C.fx},bad=0,got=0,qt=null,now=Date.now();
    if(C.live){
      var a=ok(0),b=ok(1);
      if(a){C.gold=R[0].value.v;qt=R[0].value.t;got++}else bad++;
      if(b){C.silver=R[1].value.v;got++}else bad++;
      LIVE.mOk=a&&b;if(a&&b)LIVE.mT=now;
    }
    if(C.liveCu){LIVE.cOk=ok(2);if(ok(2)){C.lme=N(PM.comexToTon(R[2].value.v));qt=qt||R[2].value.t;got++;LIVE.cT=now}else bad++}
    if(fxDue){LIVE.xOk=ok(3);if(ok(3)){C.fx=R[3].value;LIVE.fxT=now;got++}else bad++}
    var d=new Date(qt||Date.now());if(isNaN(d))d=new Date();
    LIVE.q=d.toLocaleTimeString("en-GB");LIVE.ok=bad===0;LIVE.t=Date.now();if(got)LIVE.n++;
    var moved=o.g!==C.gold||o.s!==C.silver||o.l!==C.lme||o.f!==C.fx;
    if(first&&got)prev={gold:C.gold,silver:C.silver,lme:C.lme};
    else{if(o.g!==C.gold)prev.gold=o.g;if(o.s!==C.silver)prev.silver=o.s;if(o.l!==C.lme)prev.lme=o.l}
    if(isOwner)sync();
    if(moved||first)render();else{paint();tradeCalc()}
  }catch(e){LIVE.ok=LIVE.mOk=LIVE.cOk=LIVE.xOk=false;LIVE.t=Date.now();paint();tradeCalc()}
  finally{busy=false}
}
function stampTxt(){
  if(anyLive())return LIVE.ok&&feedOk()?"Live · "+LIVE.q:(LIVE.t?"Feed offline · orders paused":"Connecting…");
  return C.demo?"Updated "+new Date().toLocaleTimeString("en-GB"):(C.at?"Updated "+C.at:"Live");
}
function paint(){$("stamp").textContent=stampTxt();$("dot").style.background=anyLive()&&LIVE.t&&!(LIVE.ok&&feedOk())?"#ffb4a8":""}
function render(){
  paint();
  home();hist();port();
  ["home","trade","port","hist","set"].forEach(function(p){$("p_"+p).hidden=p!==page});
  [].forEach.call(document.querySelectorAll(".nav button"),function(b){if(b.getAttribute("data-p")===page)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
  tradeCalc();
}
$("p_home").addEventListener("click",function(e){var h=e.target.getAttribute("data-h");if(h){HT=h;home()}});
document.querySelector(".nav").addEventListener("click",function(e){var p=e.target.getAttribute("data-p");if(p){page=p;render();window.scrollTo(0,0)}});
setInterval(function(){
  if(!demoOn())return;left--;var cd=$("cd");if(cd)cd.textContent=left;
  if(left<=0){left=60;prev={gold:C.gold,silver:C.silver,lme:C.lme};C.gold*=1+(Math.random()-.5)*0.002;C.silver*=1+(Math.random()-.5)*0.004;C.lme*=1+(Math.random()-.5)*0.003;render()}
},1000);
tradeInit();setp();render();pull();
setInterval(function(){if(!document.hidden)pull()},60000);
var gateKey="";setInterval(function(){var k=[feedOk(),feedOk("g99"),feedOk("c0")].join();if(k!==gateKey){gateKey=k;paint();tradeCalc()}},3000);
document.addEventListener("visibilitychange",function(){if(!document.hidden&&Date.now()-LIVE.t>15000)pull()});
(async function(){try{var u=await claude.use("user");if(u&&u.isOwner()){isOwner=true;who=String(u.name||u.displayName||u.email||"admin").slice(0,60);setp()}}catch(e){}})();
</script>
