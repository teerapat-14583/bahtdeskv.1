<!DOCTYPE html>
<html lang="en" data-theme="dark" style="color-scheme: dark;"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Baht Desk · เฮียอ้วนรวย โลหะกิจ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Sans+Thai:wght@400;500;600&amp;display=swap">
<style>
:root{--bg:#f6f9fd;--surf:#fff;--ink:#0b1f3a;--mut:#6b7a90;--line:#e3eaf3;--gold:#1d5bd8;--goldbg:#fff;--silv:#1d5bd8;--silvbg:#fff;--up:#0f8a5f;--dn:#d0392b;--cubg:#fff;--cu:#1d5bd8;--fxbg:#fff;--fxc:#1d5bd8;--bidbg:#f5f8fe;--askbg:#f5f8fe;--acc:#1d5bd8;--onacc:#fff;--tint:#eef4ff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1730;--surf:#12223f;--ink:#e6edf8;--mut:#8fa3c2;--line:#22365a;--gold:#e0b355;--goldbg:#2d2614;--silv:#b4c0cb;--silvbg:#26313b;--up:#4fcf9f;--dn:#f0806f;--cubg:#33231b;--cu:#e29a73;--fxbg:#1d2a3d;--fxc:#8fb0e6;--bidbg:#3a2220;--askbg:#16322a;--acc:#4f8cff;--onacc:#fff;--tint:#1a2f55}}
:root[data-theme="dark"]{--bg:#0b1730;--surf:#12223f;--ink:#e6edf8;--mut:#8fa3c2;--line:#22365a;--gold:#e0b355;--goldbg:#2d2614;--silv:#b4c0cb;--silvbg:#26313b;--up:#4fcf9f;--dn:#f0806f;--cubg:#33231b;--cu:#e29a73;--fxbg:#1d2a3d;--fxc:#8fb0e6;--bidbg:#3a2220;--askbg:#16322a;--acc:#4f8cff;--onacc:#fff;--tint:#1a2f55}
html{color-scheme:light dark;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.4 "IBM Plex Sans",system-ui,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.app{max-width:480px;margin:0 auto;padding:14px 14px 96px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
h1{font-size:20px;font-weight:600;margin:0;letter-spacing:-.01em}
h2{font-size:15px;font-weight:600;margin:18px 2px 8px}
.live{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--up)}
button{font:inherit;color:inherit;cursor:pointer}
.spots{display:grid;grid-template-columns:1fr 1fr;gap:10px}.spots .spot{min-width:0}.sub{margin-top:0}.card .big{font-size:24px}
.spot{border-radius:14px;padding:14px}
.spot.g{background:var(--goldbg)}.spot.s{background:var(--silvbg)}.spot.c{background:var(--cubg)}.spot.f{background:var(--fxbg)}.spot.c .n{color:var(--cu)}.spot.f .n{color:var(--fxc)}
.spot .n{font-size:13px;font-weight:500}
.spot.g .n{color:var(--gold)}.spot.s .n{color:var(--silv)}
.spot .v{font-size:26px;font-weight:600;letter-spacing:-.02em;margin:4px 0 2px}
.spot .u{font-size:12px;color:var(--mut)}
.chg{font-size:13px;font-weight:500}
.up{color:var(--up)}.dn{color:var(--dn)}
.fx{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);margin:10px 2px 0}
.card{background:var(--surf);border-radius:14px;padding:14px;margin-bottom:10px}
.card .t{font-weight:600}.card .sub{font-size:12px;color:var(--mut)}
.bb{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.bb div{border-radius:10px;padding:10px}
.bb .b{background:var(--bidbg)}.bb .a{background:var(--askbg)}
.bb small{font-size:12px;font-weight:600;display:block}
.bb .b small,.bb .b strong{color:var(--dn)}.bb .a small,.bb .a strong{color:var(--up)}
.bb strong{font-size:20px;font-weight:600}
.big{font-size:26px;font-weight:600;margin-top:6px}
.list{background:var(--surf);border-radius:14px;overflow:hidden}
.row{display:flex;justify-content:space-between;gap:10px;padding:13px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row b{font-weight:600}
.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--line);border-radius:10px;padding:3px;gap:3px;margin-bottom:12px}
.tabs button{border:0;background:transparent;padding:9px 6px;border-radius:8px;font-weight:500;color:var(--mut)}
.tabs button[aria-selected="true"]{background:var(--surf);color:var(--ink)}
.fld{display:grid;grid-template-columns:1fr 130px;gap:8px;align-items:center;margin-bottom:8px;font-size:14px}
.fld small{display:block;color:var(--mut);font-size:12px}
input,select{font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%}
.wrow{display:grid;grid-template-columns:1fr 90px;gap:8px;margin:12px 0}
.res{background:var(--bg);border-radius:12px;padding:14px;margin-top:6px}
.res .big{margin-top:2px}
.pri{background:var(--acc);color:var(--onacc);border:0;border-radius:8px;padding:10px 16px;font-weight:500}
.pg{font-size:12px;color:var(--mut)}
.foot{font-size:12px;color:var(--mut);margin:12px 2px}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surf);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
.nav div{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.nav button{border:0;background:transparent;padding:10px 2px;border-radius:8px;font-size:12px;font-weight:500;color:var(--mut)}
.nav button[aria-current="page"]{color:var(--ink);background:var(--bg);font-weight:600}
table{border-collapse:collapse;width:100%;min-width:600px;font-size:13px}th{font-size:12px;font-weight:600;color:var(--mut);text-align:left;padding:10px 12px;background:var(--bg);white-space:nowrap}td{padding:12px;border-top:1px solid var(--line);white-space:nowrap;vertical-align:top}.r{text-align:right}.tw{background:var(--surf);border-radius:14px;overflow-x:auto}
.bd{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600}.bd.Gold{background:var(--goldbg);color:var(--gold)}.bd.Silver{background:var(--silvbg);color:var(--silv)}.bd.Copper{background:var(--cubg);color:var(--cu)}.bd.Buy{background:var(--askbg);color:var(--up)}.bd.Sell{background:var(--bidbg);color:var(--dn)}
.bd.Booked{background:var(--askbg);color:var(--up)}.bd.Refine{background:rgba(139,92,246,.16);color:#8b5cf6}.bd.Settled,.bd.Cancelled{background:var(--line);color:var(--mut)}
.kpi{background:var(--surf);border-radius:14px;padding:14px;min-width:0}.kpi small{font-size:11px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;display:block}.kpi .v{font-size:19px;font-weight:600;margin:4px 0 2px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}.combo{background:linear-gradient(135deg,#1d5fd6,#1aa3e0);color:#fff}.combo .n,.combo .u{color:#fff}
.term{border-radius:12px;padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px}.term b{font-size:17px}
.ab{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:4px 8px;font-size:12px;margin-right:4px}
.ov{position:fixed;inset:0;background:rgba(10,18,24,.55);z-index:30;display:flex;align-items:center;justify-content:center;padding:16px}.md{background:var(--surf);border-radius:16px;padding:18px;width:100%;max-width:420px;max-height:90vh;overflow:auto}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
header{background:linear-gradient(135deg,#0a3a8a,#1d6fe0);border-radius:16px;padding:14px 16px;box-shadow:0 4px 14px rgba(29,78,216,.25)}
header h1{color:#fff}header .live{color:rgba(255,255,255,.88)}
.card,.list,.kpi,.tw{border:1px solid var(--line);box-shadow:0 1px 3px rgba(15,37,64,.06)}
.tabs button[aria-selected="true"]{background:var(--acc);color:var(--onacc)}
.nav{box-shadow:0 -2px 10px rgba(15,37,64,.06)}
.nav button[aria-current="page"]{color:var(--acc);background:var(--tint)}
th{background:var(--tint);color:var(--acc)}
.pri{background:var(--acc);color:var(--onacc)}
button:focus-visible,input:focus-visible,select:focus-visible{outline-color:var(--acc)}
input:focus,select:focus{border-color:var(--acc)}
</style>

.spot{position:relative;overflow:hidden;border-radius:16px;padding:12px;border:1px solid var(--line);
  background:linear-gradient(160deg,rgba(22,42,92,.88),rgba(9,20,48,.92))!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 8px 24px rgba(0,0,0,.28)}
.spot .hd{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.spot.g{border-color:rgba(243,195,79,.38);box-shadow:inset 0 -22px 30px -22px rgba(243,195,79,.55),0 8px 24px rgba(0,0,0,.28)}
.spot.s{border-color:rgba(207,216,234,.38);box-shadow:inset 0 -22px 30px -22px rgba(207,216,234,.45),0 8px 24px rgba(0,0,0,.28)}
.spot.c{border-color:rgba(242,140,78,.38);box-shadow:inset 0 -22px 30px -22px rgba(242,140,78,.55),0 8px 24px rgba(0,0,0,.28)}
.spot.f{border-color:rgba(86,140,255,.5);background:linear-gradient(160deg,rgba(24,64,160,.9),rgba(10,28,76,.92))!important}

.combo,.spot.combo{background:linear-gradient(135deg,#2f7bff,#1747b8)!important;border-color:rgba(140,190,255,.6)}
.combo .n,.combo .u,.combo .v,.combo .chg{color:#fff!important}
.fx{color:#c8d6f3;border-left:3px solid var(--acc);padding-left:9px;margin:14px 2px 0}
/* tabs */
.tabs{background:rgba(10,22,52,.85);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.tabs button{display:flex;align-items:center;justify-content:center;gap:8px;color:#dbe6ff;font-weight:500;padding:10px 6px;border-radius:11px}
.tabs button[aria-selected="true"]{background:linear-gradient(180deg,#3b8bff,#1a5fe0);color:#fff;box-shadow:inset 0 0 0 1px rgba(150,195,255,.6),0 6px 20px rgba(47,123,255,.45)}
.tb{width:26px;height:18px;flex:none}
/* cards and prices */
.card,.list,.kpi,.tw{background:linear-gradient(160deg,rgba(18,36,82,.85),rgba(8,18,44,.92));border:1px solid var(--line);border-radius:16px;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.card .t{color:#fff;font-size:17px}
.card .sub,.pg,.foot{color:var(--mut)}
.bb div{border-radius:12px;padding:10px 12px}
.bb .b{background:linear-gradient(135deg,#4b2b12,#26170c);border:1px solid rgba(243,170,70,.55)}
.bb .a{background:linear-gradient(135deg,#0e4330,#0a271f);border:1px solid rgba(51,214,143,.55)}
.bb .b small,.bb .b strong{color:#f6c453}
.bb .a small,.bb .a strong{color:#3fe397}
.bb small{font-size:13px}
.bb strong{font-size:21px;letter-spacing:-.01em}
.card .big{color:#fff}

.card.nug>*{position:relative}
.row{border-top-color:var(--line)}.row b{color:#fff}
.kpi .v{color:#fff}
input,select{background:rgba(4,12,32,.75);color:var(--ink);border:1px solid var(--line)}
option{background:#0c1a3d;color:#eef3ff}
th{background:rgba(47,123,255,.14);color:#9cc0ff}td{border-top-color:var(--line)}
.bd{border:1px solid var(--line)}
.res{background:rgba(4,12,32,.6);border:1px solid var(--line)}
.md{background:#0c1a3d;border:1px solid var(--line)}
.pri{background:linear-gradient(180deg,#3b8bff,#1a5fe0);color:#fff;box-shadow:0 6px 18px rgba(47,123,255,.35)}
a{color:#7fb0ff}
/* bottom bar */
.nav{background:rgba(6,14,36,.94);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line);box-shadow:0 -8px 30px rgba(0,0,0,.45);padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px))}
.nav div{gap:4px}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;color:#c4d3f2;font-size:12px;padding:8px 2px;border-radius:14px}
.nav button>span{display:flex;align-items:center;gap:3px}
.ni{width:22px;height:22px}
.nav button[aria-current="page"]{background:linear-gradient(180deg,#3b8bff,#1a5fe0);color:#fff;font-weight:600;box-shadow:inset 0 0 0 1px rgba(150,195,255,.6),0 6px 20px rgba(47,123,255,.45)}
.lk{width:11px;height:11px;vertical-align:-1px;margin-left:2px}
.lock{text-align:center;padding:34px 18px}
.lock .ic{width:48px;height:48px;border-radius:50%;background:var(--tint);color:#7fb0ff;display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
.lock input{max-width:200px;margin:16px auto 10px;display:block;text-align:center;letter-spacing:.4em;font-size:20px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #7fb0ff;outline-offset:2px}

(function (root, factory) {

    OZ_G_BAHT: "31.1035",         // grams per troy ounce used for baht-weight prices. Shop convention (matches your 11 quotes)
    BAHT_G: "15.244",             // grams per Thai gold baht-weight
    BAHT_PURITY: "0.965",         // Thai gold 96.5%
    BAHT_PER_KG: "65.6",          // gold baht-weights per kg. Shop rule, 16 Nov 2026
    OZ_PER_KG_GOLD: "32.148",     // troy oz per kg used for gold. Shop convention, confirmed 30 Oct 2026
    OZ_PER_KG_SILVER: "32.1507",  // troy oz per kg used for silver. Confirmed 30 Oct 2026
    LB_PER_TON: "2204.62262",     // pounds per metric ton (COMEX copper feed conversion)
    SILVER_925: "0.925"           // sterling purity
  };

  // ---------- exact decimal ----------
  function Dec(n, s) { this.n = n; this.s = s; } // value = n / 10^s
  var P10 = {};
  function pow10(k) { return P10[k] || (P10[k] = 10n ** BigInt(k)); }

  function numStr(x) {
    if (!isFinite(x)) throw new Error("not a finite number: " + x);
    var t = String(x);
    if (/e/i.test(t)) t = x.toFixed(20).replace(/0+$/, "").replace(/\.$/, "");
    return t;
  }
  function D(x) {
    if (x instanceof Dec) return x;
    var t = typeof x === "number" ? numStr(x) : String(x).trim();
    var m = /^(-?)(\d+)(?:\.(\d+))?$/.exec(t);
    if (!m) throw new Error("not a decimal: " + x);
    var f = m[3] || "";
    var n = BigInt(m[2] + f);
    return new Dec(m[1] ? -n : n, f.length);
  }
  function align(a, b) {
    var s = Math.max(a.s, b.s);
    return [a.n * pow10(s - a.s), b.n * pow10(s - b.s), s];
  }
  function add(a, b) { var q = align(D(a), D(b)); return new Dec(q[0] + q[1], q[2]); }
  function sub(a, b) { var q = align(D(a), D(b)); return new Dec(q[0] - q[1], q[2]); }
  function mul(a, b) { a = D(a); b = D(b); return new Dec(a.n * b.n, a.s + b.s); }
  // integer division with half-up rounding (ties away from zero)
  function divRound(num, den) {

    var neg = (num < 0n) !== (den < 0n);

  function divTo(a, b, dp) {

    return new Dec(divRound(a.n, pow10(a.s - dp)), dp);
  }
  function str(a, dp) {
    a = roundTo(a, dp);
    var neg = a.n < 0n, v = (neg ? -a.n : a.n).toString();
    if (dp === 0) return (neg ? "-" : "") + v;
    while (v.length <= dp) v = "0" + v;
    return (neg ? "-" : "") + v.slice(0, v.length - dp) + "." + v.slice(v.length - dp);
  }
  function positive(name, x) {

  }
  function nonNeg(name, x) {

  function audit(rule, inputs, used) {
    var c = {};
    used.forEach(function (k) { c[k] = CONSTANTS[k]; });

  // ---------- products ----------

  // Gold 99.99%, THB per kg.  offer = round2(gold * 32.148 * fx + add);  bid = round2(offer - deduct)
  // feeds: the bid is taken from the rounded offer.

    var add_ = nonNeg("add", i.add == null ? 0 : i.add), ded = nonNeg("deduct", i.deduct == null ? 0 : i.deduct);
    var offer = roundTo(add(mul(mul(gold, CONSTANTS.OZ_PER_KG_GOLD), fx), add_), 2);
    var bid = roundTo(sub(offer, ded), 2);
    return { bid: str(bid, 2), offer: str(offer, 2), unit: "THB/kg",
      audit: audit("gold99.v1", i, ["OZ_PER_KG_GOLD"]) };
  }

  // Gold 96.5% bar and ornament, THB per baht-weight.
  // Starts from the Gold Traders Association announcement and moves it by the change in (spot * fx) since
  // the announcement (the "anchor"). ratio = (gold*fx) / (anchorGold*anchorFx).
  //   bar.bid   = round2(gtaBarBid * ratio)          bar.offer = round2(gtaBarOffer * ratio)
  //   orn.offer = round2(gtaOrnOffer * ratio)        orn.taxBase = round2(gtaTax * ratio)
  //   orn.bid   = round2(bar.bid * (100 - ornDeductPct) / 100)   feeds: uses the rounded bar bid
  function goldBaht96(i) {

    var aG = positive("anchorGold", i.anchorGold), aF = positive("anchorFx", i.anchorFx);
    var num = mul(gold, fx), den = mul(aG, aF);

      return divTo(top, den, 2);
    }

      bar: { bid: str(barBid, 2), offer: str(barOffer, 2) },
      ornament: { bid: str(ornBid, 2), offer: str(ornOffer, 2), taxBase: str(tax, 2) },
      unit: "THB/baht-weight",

  //   s99.bid = round2(base - bidDeduct)   s99.offer = round2(base + offerAdd)
  //   s925 = round2(s99 * 0.925)           feeds: 92.5% is taken from the rounded 99.99% price
  function silver(i) {
    var s = positive("silver", i.silver), fx = positive("fx", i.fx);
    var base = mul(mul(s, CONSTANTS.OZ_PER_KG_SILVER), fx);
    var bid = roundTo(sub(base, nonNeg("bidDeduct", i.bidDeduct == null ? 0 : i.bidDeduct)), 2);
    var offer = roundTo(add(base, nonNeg("offerAdd", i.offerAdd == null ? 0 : i.offerAdd)), 2);
    return {
      s99: { bid: str(bid, 2), offer: str(offer, 2) },
      s925: { bid: str(mul(bid, CONSTANTS.SILVER_925), 2), offer: str(mul(offer, CONSTANTS.SILVER_925), 2) },
      unit: "THB/kg",
      audit: audit("silver.v1", i, ["OZ_PER_KG_SILVER", "SILVER_925"])

  }

  // Copper flat price, THB per kg, whole baht.  flat = round0(lme * fx / 1000)
  // Grade price = round0(flat + adjustment); adjustment is usually negative and may be a decimal.
  function copper(i) {
    var lme = positive("lme", i.lme), fx = positive("fx", i.fx);
    var flat = divTo(mul(lme, fx), 1000, 0);
    var grades = (i.adjustments || []).map(function (a) { return str(add(flat, a), 0); });
    return { flat: str(flat, 0), grades: grades, unit: "THB/kg", audit: audit("copper.v1", i, []) };
  }

  // Gold 96.5% bar from the 99.99% kg price, THB per baht-weight. Shop rule, 16 Nov 2026.
  //   bar.bid = round2(g99.bid / 65.6 * 0.965)    bar.offer = round2(g99.offer / 65.6 * 0.965)
  //   ornBid  = round2(bar.bid * (100 - ornDeductPct) / 100)
  // feeds: uses the rounded 99.99% prices, and the ornament bid uses the rounded bar bid.
  function goldBar96FromKg(i) {
    var b = positive("g99Bid", i.g99Bid), o = positive("g99Offer", i.g99Offer);
    function at(x) { return divTo(mul(x, CONSTANTS.BAHT_PURITY), CONSTANTS.BAHT_PER_KG, 2); }
    var bid = at(b), offer = at(o);
    var ded = nonNeg("ornDeductPct", i.ornDeductPct == null ? 0 : i.ornDeductPct);
    var ornBid = divTo(mul(bid, sub(100, ded)), 100, 2);
    return { bid: str(bid, 2), offer: str(offer, 2), ornBid: str(ornBid, 2), unit: "THB/baht-weight",
      audit: audit("goldBar96.v2", i, ["BAHT_PURITY", "BAHT_PER_KG"]) };
  }

  // Silver, THB per kg. Shop rule, 16 Nov 2026.  base = silver * 32.1507 * fx (not rounded)
  //   bar.bid   = round2(base + barAdd)                  no VAT
  //   bar.offer = round2((base + barAdd) * (100 + vat) / 100)   VAT included
  //   grains    = round2(base + grainAdd)                one price
  //   s925      = round2((base + grainAdd) * 0.925)
  function silver2(i) {
    var s = positive("silver", i.silver), fx = positive("fx", i.fx);
    var base = mul(mul(s, CONSTANTS.OZ_PER_KG_SILVER), fx);
    var bar = add(base, D(i.barAdd == null ? 0 : i.barAdd));
    var vat = nonNeg("vatPct", i.vatPct == null ? 0 : i.vatPct);
    var barOffer = divTo(mul(bar, add(100, vat)), 100, 2);
    var gr = add(base, D(i.grainAdd == null ? 0 : i.grainAdd));
    return { bar: { bid: str(bar, 2), offer: str(barOffer, 2) }, grains: str(gr, 2),
      s925: str(mul(gr, CONSTANTS.SILVER_925), 2), unit: "THB/kg",
      audit: audit("silver.v2", i, ["OZ_PER_KG_SILVER", "SILVER_925"]) };
  }

  // Order total for a weight. rate is a price from above.
  //   unit "kg":   total = rate * grams / 1000
  //   unit "baht": total = rate * grams / 15.244      (rate is per baht-weight)
  // One division at the end, then rounded to dp (2 for gold and silver, 0 for copper).
  function orderTotal(i) {
    var rate = positive("rate", i.rate), g = positive("grams", i.grams);
    var dp = i.dp == null ? 2 : i.dp;
    var top = mul(rate, g), total;
    if (i.unit === "kg") total = divTo(top, 1000, dp);
    else if (i.unit === "baht") total = divTo(top, CONSTANTS.BAHT_G, dp);
    else throw new Error("unit must be kg or baht");
    return { total: str(total, dp), audit: audit("orderTotal.v1", i, i.unit === "baht" ? ["BAHT_G"] : []) };
  }

  // THEORETICAL valuation of Thai 96.5% gold, THB per baht-weight. NOT a dealer quote.
  //   bid = (spot - bidSpread) * 15.244 / 31.1035 * fx * 0.965     offer = (spot + askSpread) * ...
  // This is the formula printed on the website's price table. It is a reference for comparison only.
  function theoreticalBaht96(i) {
    var spot = positive("spot", i.spot), fx = positive("fx", i.fx);
    var bs = nonNeg("bidSpread", i.bidSpread == null ? "3.5" : i.bidSpread);
    var as = nonNeg("askSpread", i.askSpread == null ? "1.5" : i.askSpread);
    function at(px) {
      var top = mul(mul(mul(px, CONSTANTS.BAHT_G), fx), CONSTANTS.BAHT_PURITY);
      return divTo(top, CONSTANTS.OZ_G_BAHT, 2);
    }
    return { bid: str(at(sub(spot, bs)), 2), offer: str(at(add(spot, as)), 2), unit: "THB/baht-weight",
      priceType: "theoretical",
      audit: audit("theoreticalBaht96.v1", i, ["BAHT_G", "BAHT_PURITY", "OZ_G_BAHT"]) };
  }

  // Value of a weight of metal at its purity, in THB. No dealer margin, add-on or spread.
  //   gold, unit baht : spot * fx * (baht * 15.244 g) / 31.1035 * purity
  //   gold, unit g/kg : spot * fx * 32.148 oz/kg * kg * purity
  //   silver, g/kg    : spot * fx * 32.1507 oz/kg * kg * purity
  //   copper, kg/t    : lme * fx / 1000 * kg   (no purity), spot is USD per metric ton
  // Rounded once to 2 decimals, half up.
  function valuation(i) {
    var spot = positive("spot", i.spot), fx = positive("fx", i.fx), w = positive("weight", i.weight);
    var metal = i.metal, unit = i.unit, purity = metal === "copper" ? D(1) : positive("purity", i.purity);
    if (purity.n > pow10(purity.s)) throw new Error("purity must not exceed 1");
    var base = mul(spot, fx), used = [], rule;
    if (metal === "gold" && unit === "baht") {
      var grams = mul(w, CONSTANTS.BAHT_G);
      var top = mul(mul(base, grams), purity);
      used = ["BAHT_G", "OZ_G_BAHT"]; rule = "valuation.goldBaht.v1";
      return { value: str(divTo(top, CONSTANTS.OZ_G_BAHT, 2), 2), unit: "THB", priceType: "theoretical",
        audit: audit(rule, i, used) };
    }
    if (metal === "gold" || metal === "silver") {
      var perOz = metal === "gold" ? CONSTANTS.OZ_PER_KG_GOLD : CONSTANTS.OZ_PER_KG_SILVER;
      if (unit !== "kg" && unit !== "g") throw new Error("unit must be g or kg (or baht for gold)");
      // grams are converted to kg by shifting the decimal point, so nothing is rounded
      var kgExact = unit === "kg" ? w : new Dec(w.n, w.s + 3);
      return { value: str(mul(mul(mul(base, perOz), kgExact), purity), 2), unit: "THB", priceType: "theoretical",
        audit: audit("valuation." + metal + ".v1", i, [metal === "gold" ? "OZ_PER_KG_GOLD" : "OZ_PER_KG_SILVER"]) };
    }
    if (metal === "copper") {
      var kgc = unit === "kg" ? w : unit === "t" ? mul(w, 1000) : null;
      if (!kgc) throw new Error("copper unit must be kg or t");
      return { value: str(divTo(mul(base, kgc), 1000, 2), 2), unit: "THB", priceType: "theoretical",
        audit: audit("valuation.copper.v1", i, []) };
    }
    throw new Error("metal must be gold, silver or copper");
  }

  // COMEX HG (USD per lb) to USD per metric ton.
  function comexToTon(hg) {
    return str(mul(positive("hg", hg), CONSTANTS.LB_PER_TON), 2);
  }

  return {
    VERSION: VERSION, CONSTANTS: CONSTANTS,
    gold99: gold99, goldBaht96: goldBaht96, silver: silver, copper: copper,
    goldBar96FromKg: goldBar96FromKg, silver2: silver2,
    orderTotal: orderTotal, theoreticalBaht96: theoreticalBaht96, valuation: valuation, comexToTon: comexToTon
  };
});

function num(id,d){var v=parseFloat($(id).value);return isFinite(v)?v:d}

  prev={gold:C.gold,silver:C.silver,lme:C.lme};

  C.tDays=num("a_td",C.tDays);C.rDays=num("a_rd",C.rDays);C.cuRel=GR.map(function(n,i){return num("a_p"+i,C.cuRel[i])});C.prem=cuChain(C.cuRel);C.demo=$("a_d").value==="1";C.at=stamp();
  var p=P();C.hist.unshift({t:C.at,g:C.gold,s:C.silver,fx:C.fx,l:C.lme,gb:p.g99.b,go:p.g99.o,sb:p.s99.b,so:p.s99.o});C.hist=C.hist.slice(0,60);

    await a.publish(buildHtml())}catch(e){$("msg").textContent="Could not publish: "+(e&&(e.message||e.code)||"error")}

function anyLive(){return C.live||C.liveFx||C.liveCu}

function sel(id,on,l,sm,a,b){return '<div class="fld"><div>'+l+'<small>'+sm+'</small></div><select id="'+id+'"><option value="1"'+(on?" selected":"")+'>'+a+'</option><option value="0"'+(on?"":" selected")+'>'+b+'</option></select></div>'}
function srcSel(){return sel("a_live",C.live,"Gold and silver","From the live market feed","Live feed","Typed by admin")+sel("a_livefx",C.liveFx,"USD/THB","Live feed is a daily reference rate","Live feed","Typed by admin")+sel("a_livecu",C.liveCu,"Copper","Live feed is COMEX futures, not LME","Live feed","Typed by admin (LME)")}
function sync(){[["a_fx",C.fx],["a_g",C.gold],["a_s",C.silver],["a_l",C.lme]].forEach(function(p){var e=$(p[0]);if(e&&e.disabled)e.value=p[1]})}

// ---- Live price feed: Gold-API (gold, silver, copper) + Frankfurter (USD/THB) ----
var API={px:"https://api.gold-api.com/price/",fx:"https://api.frankfurter.dev/v2/rates?base=USD&quotes=THB"},LIVE={ok:false,t:0,n:0,q:"",fxT:0,mT:0,cT:0,mOk:false,cOk:false,xOk:false},busy=false,TMO=8000;
function jget(u){var a=new AbortController(),t=setTimeout(function(){a.abort()},TMO);return fetch(u,{cache:"no-store",signal:a.signal}).then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}).finally(function(){clearTimeout(t)})}
// Orders are only allowed while every live price they depend on is fresh (last poll succeeded, under 2 minutes old; USD/THB under 30 minutes).
function fresh(t,ms){return Date.now()-t<(ms||120000)}
// Typed LME copper: an admin enters it each morning. It counts as current for 24 hours from the entry time.
var LU_MS=864e5;
function luOk(){return !!C.luT&&Date.now()-C.luT<LU_MS}
function esc(t){return String(t==null?"":t).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function luTxt(){return C.luT?new Date(C.luT).toLocaleString("en-GB",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"})+(C.luBy?" by "+esc(C.luBy):""):"not entered yet"}
// ---- Daily LME copper: a scheduled task writes the latest LME cash settlement price to row 2 of a public Google Sheet.
// Columns: A settlement date | B USD/t | C updated at (UTC, ISO) | D source. The page reads it on load and every 30 minutes.
// The sheet price is used only when it is newer than the last admin entry, so a price typed in Setting still wins until the next daily update.
var CU_SHEET="https://docs.google.com/spreadsheets/d/1GS_GNYuOh2VbNdRudF8SbF31P4mUTQsJd4SyZ0Kb4B4/gviz/tq?tqx=out:csv&sheet=LME&range=A2:D2&headers=0",cuBusy=false,cuT=0;
// Google's CSV export quotes every field, so read the quoted fields of the first line.
function csvRow(t){var line=String(t).split(/\r?\n/)[0]||"",out=[],m,re=/"((?:[^"]|"")*)"/g;while((m=re.exec(line)))out.push(m[1].replace(/""/g,'"'));return out}
function pullCu(){
  if(cuBusy||C.liveCu)return;cuBusy=true;
  var a=new AbortController(),tm=setTimeout(function(){a.abort()},TMO);
  fetch(CU_SHEET,{cache:"no-store",signal:a.signal}).then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.text()}).then(function(t){
    var c=csvRow(t),px=parseFloat(String(c[1]||"").replace(/,/g,"")),ut=Date.parse(c[2]||""),dt=c[0]||"";
    if(!(px>0)||!isFinite(ut)||ut>Date.now()+3e5)throw new Error("bad sheet row");
    cuT=Date.now();
    if(ut<=(C.luT||0))return;
    if(px!==C.lme)prev.lme=C.lme;
    C.lme=px;C.luT=ut;C.luBy="auto (LME "+dt+")";
    // keep the admin's LME field in step, so pressing Save doesn't put the older typed price back
    var el=$("a_l");if(el)el.value=C.lme;
    render();
  }).catch(function(){}).finally(function(){clearTimeout(tm);cuBusy=false});
}
function feedOk(pk){
  var cu=!!pk&&pk.charAt(0)==="c",x=!C.liveFx||(LIVE.xOk&&fresh(LIVE.fxT,18e5)),m=!C.live||(LIVE.mOk&&fresh(LIVE.mT)),c=!C.liveCu||(LIVE.cOk&&fresh(LIVE.cT));
  return pk?x&&(cu?(C.liveCu?c:luOk()):m):x&&m&&c;
}
function gateMsg(pk){
  var cu=!!pk&&pk.charAt(0)==="c";
  if(cu&&!C.liveCu&&!luOk()&&(!C.liveFx||(LIVE.xOk&&fresh(LIVE.fxT,18e5))))return"The LME copper price has not been entered in the last 24 hours, so copper orders are paused until the admin enters today's price.";
  return"Live prices are offline, so orders are paused. They resume when the feed reconnects."}
function quote(m){return jget(API.px+m).then(function(d){var v=d&&d.price;if(typeof v!=="number"||!(v>0))throw new Error(m+" bad price");return{v:v,t:d.updatedAt}})}
function rate(){return jget(API.fx).then(function(d){var v=Array.isArray(d)?d[0]&&d[0].rate:d&&d.rates&&d.rates.THB;if(typeof v!=="number"||!(v>0))throw new Error("bad rate");return v})}
async function pull(){
  if(busy||!anyLive())return;busy=true;
  try{
    var fxDue=C.liveFx&&Date.now()-LIVE.fxT>6e5;
    var R=await Promise.allSettled([C.live?quote("XAU"):null,C.live?quote("XAG"):null,C.liveCu?quote("HG"):null,fxDue?rate():null]);
    var ok=function(i){return R[i].status==="fulfilled"&&R[i].value!==null},first=!LIVE.n,o={g:C.gold,s:C.silver,l:C.lme,f:C.fx},bad=0,got=0,qt=null,now=Date.now();
    if(C.live){
      var a=ok(0),b=ok(1);
      if(a){C.gold=R[0].value.v;qt=R[0].value.t;got++}else bad++;
      if(b){C.silver=R[1].value.v;got++}else bad++;
      LIVE.mOk=a&&b;if(a&&b)LIVE.mT=now;
    }
    if(C.liveCu){LIVE.cOk=ok(2);if(ok(2)){C.lme=N(PM.comexToTon(R[2].value.v));qt=qt||R[2].value.t;got++;LIVE.cT=now}else bad++}
    if(fxDue){LIVE.xOk=ok(3);if(ok(3)){C.fx=R[3].value;LIVE.fxT=now;got++}else bad++}
    var d=new Date(qt||Date.now());if(isNaN(d))d=new Date();
    LIVE.q=d.toLocaleTimeString("en-GB");LIVE.ok=bad===0;LIVE.t=Date.now();if(got)LIVE.n++;
    var moved=o.g!==C.gold||o.s!==C.silver||o.l!==C.lme||o.f!==C.fx;
    if(first&&got)prev={gold:C.gold,silver:C.silver,lme:C.lme};
    else{if(o.g!==C.gold)prev.gold=o.g;if(o.s!==C.silver)prev.silver=o.s;if(o.l!==C.lme)prev.lme=o.l}
    if(isOwner)sync();
    if(moved||first)render();else{paint();tradeCalc()}
  }catch(e){LIVE.ok=LIVE.mOk=LIVE.cOk=LIVE.xOk=false;LIVE.t=Date.now();paint();tradeCalc()}
  finally{busy=false}
}

  if(anyLive())return LIVE.ok&&feedOk()?"Live · "+LIVE.q:(LIVE.t?"Feed offline · orders paused":"Connecting…");
  return C.demo?"Updated "+new Date().toLocaleTimeString("en-GB"):(C.at?"Updated "+C.at:"Live");
